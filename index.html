<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EMILY MULTISERVICIOS - LIVE RATES</title>
    
    <link rel="icon" type="image/png" href="euro_3524336.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --canvas-soft: #e8ebe6; /* Sage Background */
            --white: #ffffff;       /* Card Background */
            --ink: #0e0f0c;         /* Near-black Text */
            --primary: #9fe870;     /* Wise Lime Green */
            --body-text: #454745;   /* Secondary Text */
            --positive: #2ead4b;    /* Success Green */
        }

        body {
            background-color: var(--canvas-soft);
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 0;
            overflow: hidden; 
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* FLEXBOX HEADER */
        header {
            padding: 3vh 5vw 2vh 5vw;
            background: var(--canvas-soft);
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .header-main {
            text-align: left;
            max-width: 70%;
        }

        header h1 { 
            font-size: clamp(24px, 4vw, 48px); 
            font-weight: 900; 
            margin: 0; 
            letter-spacing: -0.04em; 
            line-height: 1.1;
        }
        
        .address {
            font-size: clamp(11px, 1.3vw, 16px); 
            color: var(--body-text);
            margin: 0.8vh 0;
            font-weight: 600;
        }

        .subtitle-pill { 
            display: inline-block;
            background-color: var(--primary); 
            color: var(--ink);
            font-size: clamp(12px, 1.2vw, 18px); 
            font-weight: 900;
            padding: 8px 20px;
            border-radius: 24px; 
            margin-top: 0.5vh;
            letter-spacing: -0.02em;
        }

        /* TIME & DATE CONTAINER */
        #live-clock {
            text-align: right;
            color: var(--ink);
            font-weight: 600;
            line-height: 1.2;
            padding-top: 0.5vh;
        }
        #clock-time { font-size: clamp(18px, 2.2vw, 32px); font-weight: 900; display: block; }
        #clock-date { font-size: clamp(11px, 1.2vw, 16px); color: var(--body-text); text-transform: uppercase; }

        /* MOBILE ADJUSTMENT */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: center;
                text-align: center;
                padding: 2.5vh 4vw 1.5vh 4vw;
            }
            .header-main {
                max-width: 100%;
                text-align: center;
            }
            #live-clock {
                text-align: center;
                padding-top: 0;
                margin: 1vh 0;
                display: flex;
                gap: 8px;
                align-items: center;
                justify-content: center;
            }
            #clock-time {
                font-size: 18px;
                display: inline-block;
                background: rgba(0, 0, 0, 0.05);
                padding: 2px 8px;
                border-radius: 6px;
            }
            #clock-date {
                font-size: 13px;
                display: inline-block;
                font-weight: 600;
            }
        }

        /* SCROLLING TABLE SECTION */
        #scroll-container { 
            flex-grow: 1; 
            position: relative; 
            overflow: hidden; 
            touch-action: none; /* Prevents default browser refreshing while dragging */
        }
        #scroller { 
            position: absolute; 
            width: 100%; 
            top: 0; 
            left: 0; 
            will-change: transform; 
            cursor: grab;
        }
        #scroller:active {
            cursor: grabbing;
        }

        @keyframes scrollUp { 
            0% { transform: translate3d(0, 0, 0); } 
            100% { transform: translate3d(0, -50%, 0); } 
        }

        table { width: 100%; border-collapse: separate; border-spacing: 0 1.5vh; padding: 0 5vw 2vw 5vw; }
        tr { background: var(--white); border-radius: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        td { padding: 2.5vh 3vw; vertical-align: middle; }
        
        td:first-child { border-radius: 24px 0 0 24px; width: 10%; text-align: center; }
        td:nth-child(2) { width: 45%; }

        .country-name {
            font-size: clamp(18px, 3vw, 32px);
            font-weight: 900;
            letter-spacing: -0.03em;
            display: block;
            text-transform: uppercase;
        }

        .curr-label { 
            display: block; 
            font-size: clamp(11px, 1.3vw, 16px); 
            color: var(--body-text); 
            font-weight: 600;
            margin-top: 2px;
        }

        td:last-child { 
            border-radius: 0 24px 24px 0;
            text-align: right; 
            color: var(--positive); 
            font-size: clamp(24px, 5.5vw, 60px); 
            font-weight: 900;
            letter-spacing: -0.04em;
        }

        .flag-img { width: 6vw; min-width: 40px; height: auto; border-radius: 4px; }

        /* ATTRIBUTION FOOTER */
        footer {
            text-align: center;
            padding: 1vh 0;
            background: var(--canvas-soft);
            z-index: 100;
        }
        footer a {
            font-size: 10px;
            color: var(--body-text);
            text-decoration: none;
            opacity: 0.6;
        }
        footer a:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

<header>
    <div class="header-main">
        <h1>Emily Multiservicios Locutorio</h1>
        <div class="address">Calle Gabino Jimeno 9, Metro Usera, Madrid</div>
        <div class="subtitle-pill">TASAS EN VIVO POR 1€</div>
    </div>

    <div id="live-clock">
        <span id="clock-time">00:00</span>
        <span id="clock-date">Cargando...</span>
    </div>
</header>

<div id="scroll-container">
    <div id="scroller">
        <table id="ratesTable">
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<footer>
    <a href="https://www.flaticon.com/free-icons/euro" title="euro icons" target="_blank" rel="noopener noreferrer">Euro icons created by Creative Stall Premium - Flaticon</a>
</footer>

<script>
    // --- LIVE CLOCK LOGIC ---
    function updateClock() {
        const now = new Date();
        const timeOptions = { hour: '2-digit', minute: '2-digit', hour12: false };
        const dateOptions = { weekday: 'long', day: 'numeric', month: 'long' };
        
        document.getElementById('clock-time').textContent = now.toLocaleTimeString('es-ES', timeOptions);
        document.getElementById('clock-date').textContent = now.toLocaleDateString('es-ES', dateOptions);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- GOOGLE SHEETS LOGIC ---
    const sheetId = '1CCWJaJCsaewVCpmCglL50xKdamLB77wanCY-Xxlg4kg'; 
    let lastDataHash = ""; 

    const config = [
        { name: "VENEZUELA", code: "VE", curr: "Bolívar Soberano" },
        { name: "BOLIVIA", code: "BO", curr: "Bolivianos" },
        { name: "ECUADOR", code: "EC", curr: "Dólares (US)" },
        { name: "PERU", code: "PE", curr: "Soles" },
        { name: "BRASIL", code: "BR", curr: "Reales" },
        { name: "COLOMBIA", code: "CO", curr: "Pesos" },
        { name: "PARAGUAY", code: "PY", curr: "Guaraníes" },
        { name: "HONDURAS", code: "HN", curr: "Lempiras" },
        { name: "ARGENTINA", code: "AR", curr: "Pesos" },
        { name: "NICARAGUA", code: "NI", curr: "Córdobas" },
        { name: "GUATEMALA", code: "GT", curr: "Quetzales" },
        { name: "EL SALVADOR", code: "SV", curr: "Dólares (US)" },
        { name: "REP. DOMINICANA", code: "DO", curr: "Pesos" }
    ];

    function fetchData() {
        const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=responseHandler:renderData&headers=0`;
        const oldScript = document.getElementById('jsonp-script');
        if (oldScript) oldScript.remove();
        const script = document.createElement('script');
        script.id = 'jsonp-script';
        script.src = url;
        document.body.appendChild(script);
    }

    window.renderData = function(data) {
        if (!data || !data.table) return;

        const currentDataString = JSON.stringify(data.table.rows);
        if (currentDataString === lastDataHash) return;
        lastDataHash = currentDataString;

        const rows = data.table.rows;
        const dataMap = {};
        rows.forEach(r => {
            if (!r.c || !r.c[0]) return;
            const name = r.c[0].v.toString().toUpperCase().trim();
            const cleanKey = name.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            dataMap[cleanKey] = r.c[3] ? (r.c[3].f || r.c[3].v) : "---";
        });

        let html = '';
        config.forEach(c => {
            const rate = dataMap[c.name] || "---";
            html += `<tr>
                <td><img class="flag-img" src="https://flagcdn.com/w160/${c.code.toLowerCase()}.png"></td>
                <td>
                    <span class="country-name">${c.name}</span>
                    <span class="curr-label">${c.curr}</span>
                </td>
                <td>${rate}</td>
            </tr>`;
        });

        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = html + html + html; // Loops content seamlessly
        setupInteractions();
    };

    // --- PAUSE, RESUME & TOUCH SCROLL INTERACTION LOGIC ---
    function setupInteractions() {
        const container = document.getElementById('scroll-container');
        const scroller = document.getElementById('scroller');
        
        // Start the automatic infinite loop scrolling
        scroller.style.animation = 'scrollUp 45s linear infinite';

        let isDragging = false;
        let startY = 0;
        let currentTranslateY = 0;
        let animationOffset = 0;

        // Helper to get current rendered transform Y coordinates
        function getComputedY() {
            const style = window.getComputedStyle(scroller);
            const matrix = new WebKitCSSMatrix(style.transform);
            return matrix.m42;
        }

        // DESKTOP: Hovering freezes the list, moving mouse away resumes it
        container.addEventListener('mouseenter', () => {
            if (!isDragging) scroller.style.animationPlayState = 'paused';
        });

        container.addEventListener('mouseleave', () => {
            if (!isDragging) scroller.style.animationPlayState = 'running';
        });

        // MOBILE & MOUSE DRAGGING INTEGRATION
        function dragStart(e) {
            isDragging = true;
            scroller.style.animation = 'none'; // Kill animation strictly during manual scroll
            
            // Accommodate both touch input or a standard mouse click drag
            const pageY = e.touches ? e.touches[0].pageY : e.pageY;
            startY = pageY - currentTranslateY;
        }

        function dragMove(e) {
            if (!isDragging) return;
            const pageY = e.touches ? e.touches[0].pageY : e.pageY;
            currentTranslateY = pageY - startY;

            // Loop parameters boundary validation
            const halfHeight = -scroller.offsetHeight / 2;
            if (currentTranslateY > 0) currentTranslateY = halfHeight;
            if (currentTranslateY < halfHeight) currentTranslateY = 0;

            scroller.style.transform = `translate3d(0, ${currentTranslateY}px, 0)`;
        }

        function dragEnd() {
            if (!isDragging) return;
            isDragging = false;

            // Dynamically recalculate new CSS keyframes based on where the user dropped the list
            const currentY = currentTranslateY;
            const totalHeight = scroller.offsetHeight / 2;
            const percentage = Math.abs(currentY / totalHeight) * 100;

            // Generate an updated synchronized runtime styling ruleset
            const styleId = 'dynamic-scroll-style';
            let dynamicStyle = document.getElementById(styleId);
            if (!dynamicStyle) {
                dynamicStyle = document.createElement('style');
                dynamicStyle.id = styleId;
                document.head.appendChild(dynamicStyle);
            }

            dynamicStyle.innerHTML = `
                @keyframes dynamicScrollUp {
                    0% { transform: translate3d(0, ${currentY}px, 0); }
                    100% { transform: translate3d(0, ${currentY - totalHeight}px, 0); }
                }
            `;

            scroller.style.animation = 'dynamicScrollUp 45s linear infinite';
            scroller.style.animationPlayState = 'running';
        }

        // Bind standard Touch Inputs
        container.addEventListener('touchstart', (e) => {
            currentTranslateY = getComputedY();
            dragStart(e);
        }, { passive: true });
        container.addEventListener('touchmove', dragMove, { passive: true });
        container.addEventListener('touchend', dragEnd);

        // Bind standard Mouse Inputs (for desktop dragging capability too)
        container.addEventListener('mousedown', (e) => {
            currentTranslateY = getComputedY();
            dragStart(e);
        });
        window.addEventListener('mousemove', dragMove);
        window.addEventListener('mouseup', dragEnd);
    }

    fetchData();
    setInterval(fetchData, 300000); 
</script>

</body>
</html>
