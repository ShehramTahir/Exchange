<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EMILY MULTISERVICIOS - LIVE RATES</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --canvas-soft: #e8ebe6; /* Sage Background */
            --white: #ffffff;       /* Card Background */
            --ink: #0e0f0c;         /* Near-black Text */
            --primary: #9fe870;     /* Wise Lime Green */
            --body-text: #454745;   /* Secondary Text */
            --positive: #2ead4b;    /* Success Green */
        }

        body {
            background-color: var(--canvas-soft);
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 0;
            overflow: hidden; 
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER SECTION */
        header {
            padding: 2vh 5vw;
            background: var(--canvas-soft);
            text-align: center;
            position: relative;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* DATE & TIME - Fixed for Mobile Overlap */
        #live-clock {
            position: absolute;
            top: 2vh;
            right: 3vw;
            text-align: right;
            color: var(--ink);
            font-weight: 600;
            line-height: 1.2;
        }
        #clock-time { font-size: clamp(16px, 2vw, 28px); font-weight: 900; display: block; }
        #clock-date { font-size: clamp(10px, 1.2vw, 16px); color: var(--body-text); text-transform: uppercase; }

        @media (max-width: 768px) {
            #live-clock {
                position: static; 
                text-align: center;
                margin-bottom: 10px;
                order: -1; /* Clock moves above title on mobile */
            }
            header { padding: 2vh 2vw; }
        }

        header h1 { 
            font-size: clamp(20px, 4.5vw, 52px); 
            font-weight: 900; 
            margin: 0; 
            letter-spacing: -0.04em; 
            line-height: 1.1;
            max-width: 95%;
        }
        
        .address {
            font-size: clamp(10px, 1.4vw, 16px); 
            color: var(--body-text);
            margin: 0.5vh 0;
            font-weight: 600;
        }

        .subtitle-pill { 
            display: inline-block;
            background-color: var(--primary); 
            color: var(--ink);
            font-size: clamp(12px, 1.3vw, 18px); 
            font-weight: 900;
            padding: 8px 20px;
            border-radius: 24px; 
            margin-top: 1vh;
            letter-spacing: -0.02em;
        }

        /* SCROLLING TABLE SECTION */
        #scroll-container { flex-grow: 1; position: relative; overflow: hidden; }
        #scroller { position: absolute; width: 100%; top: 0; left: 0; will-change: transform; }

        @keyframes scrollUp { 
            0% { transform: translate3d(0, 0, 0); } 
            100% { transform: translate3d(0, -50%, 0); } 
        }

        table { width: 100%; border-collapse: separate; border-spacing: 0 1.5vh; padding: 0 5vw 5vw 5vw; }
        
        tr { 
            background: var(--white); 
            border-radius: 24px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.04); 
        }
        
        td { padding: 2.5vh 3vw; vertical-align: middle; }
        
        td:first-child { border-radius: 24px 0 0 24px; width: 10%; text-align: center; }
        td:nth-child(2) { width: 45%; }

        .country-name {
            font-size: clamp(18px, 3vw, 32px);
            font-weight: 900;
            letter-spacing: -0.03em;
            display: block;
            text-transform: uppercase;
        }

        .curr-label { 
            display: block; 
            font-size: clamp(11px, 1.3vw, 16px); 
            color: var(--body-text); 
            font-weight: 600;
            margin-top: 2px;
        }

        td:last-child { 
            border-radius: 0 24px 24px 0;
            text-align: right; 
            color: var(--positive); 
            font-size: clamp(24px, 5.5vw, 60px); 
            font-weight: 900;
            letter-spacing: -0.04em;
        }

        .flag-img { width: 6vw; min-width: 40px; height: auto; border-radius: 4px; }
    </style>
</head>
<body>

<header>
    <div id="live-clock">
        <span id="clock-time">00:00:00</span>
        <span id="clock-date">Cargando...</span>
    </div>
    <h1>Emily Multiservicios Locutorio</h1>
    <div class="address">Calle Gabino Jimeno 9, Metro Usera, Madrid</div>
    <div class="subtitle-pill">TASAS EN VIVO POR 1€</div>
</header>

<div id="scroll-container">
    <div id="scroller">
        <table id="ratesTable">
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    // --- LIVE CLOCK LOGIC ---
    function updateClock() {
        const now = new Date();
        const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
        const dateOptions = { weekday: 'long', day: 'numeric', month: 'long' };
        
        document.getElementById('clock-time').textContent = now.toLocaleTimeString('es-ES', timeOptions);
        document.getElementById('clock-date').textContent = now.toLocaleDateString('es-ES', dateOptions);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- GOOGLE SHEETS & DATA SAVING LOGIC ---
    const sheetId = '1CCWJaJCsaewVCpmCglL50xKdamLB77wanCY-Xxlg4kg'; 
    let lastDataHash = ""; 

    const config = [
        { name: "VENEZUELA", code: "VE", curr: "Bolívar Soberano" },
        { name: "BOLIVIA", code: "BO", curr: "Bolivianos" },
        { name: "ECUADOR", code: "EC", curr: "Dólares (US)" },
        { name: "PERU", code: "PE", curr: "Soles" },
        { name: "BRASIL", code: "BR", curr: "Reales" },
        { name: "COLOMBIA", code: "CO", curr: "Pesos" },
        { name: "PARAGUAY", code: "PY", curr: "Guaraníes" },
        { name: "HONDURAS", code: "HN", curr: "Lempiras" },
        { name: "ARGENTINA", code: "AR", curr: "Pesos" },
        { name: "NICARAGUA", code: "NI", curr: "Córdobas" },
        { name: "GUATEMALA", code: "GT", curr: "Quetzales" },
        { name: "EL SALVADOR", code: "SV", curr: "Dólares (US)" },
        { name: "REP. DOMINICANA", code: "DO", curr: "Pesos" }
    ];

    function fetchData() {
        const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=responseHandler:renderData&headers=0`;
        const oldScript = document.getElementById('jsonp-script');
        if (oldScript) oldScript.remove();
        const script = document.createElement('script');
        script.id = 'jsonp-script';
        script.src = url;
        document.body.appendChild(script);
    }

    window.renderData = function(data) {
        if (!data || !data.table) return;

        // Only update the website if the Sheet data actually changed
        const currentDataString = JSON.stringify(data.table.rows);
        if (currentDataString === lastDataHash) return;
        lastDataHash = currentDataString;

        const rows = data.table.rows;
        const dataMap = {};
        rows.forEach(r => {
            if (!r.c || !r.c[0]) return;
            const name = r.c[0].v.toString().toUpperCase().trim();
            const cleanKey = name.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            dataMap[cleanKey] = r.c[3] ? (r.c[3].f || r.c[3].v) : "---";
        });

        let html = '';
        config.forEach(c => {
            const rate = dataMap[c.name] || "---";
            html += `<tr>
                <td><img class="flag-img" src="https://flagcdn.com/w160/${c.code.toLowerCase()}.png"></td>
                <td>
                    <span class="country-name">${c.name}</span>
                    <span class="curr-label">${c.curr}</span>
                </td>
                <td>${rate}</td>
            </tr>`;
        });

        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = html + html + html; 
        document.getElementById('scroller').style.animation = 'scrollUp 45s linear infinite';
    };

    fetchData();
    // Refresh every 5 minutes (300,000ms) to save internet data
    setInterval(fetchData, 300000); 
</script>

</body>
</html>
