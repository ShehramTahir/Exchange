name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inject Secret into HTML
        run: |
          # This swaps the placeholder for the secret variable
          sed -i "s/SECRET_PLACEHOLDER/$SH_ID/g" index.html
        env:
          # MAKE SURE THIS MATCHES YOUR GITHUB SETTINGS EXACTLY
          SH_ID: ${{secrets.GOOGLE_SHEET_ID}}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
